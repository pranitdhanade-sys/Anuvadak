<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Translator dashboard</title><link rel="stylesheet" href="css/style.css"></head><body><nav><a class="brand" href="/">ISL Translate</a><span id="model-status">Checking model…</span></nav><main><h1>Live translator</h1><p id="notice" role="alert" aria-live="polite"></p><div class="dashboard"><section class="panel"><video id="camera" class="camera" autoplay muted playsinline aria-label="Live webcam preview"></video><canvas id="capture" hidden></canvas><div class="controls"><button id="start">Start camera</button><button id="stop" class="secondary">Stop camera</button><button id="speak">Speak</button><button id="stop-speech" class="secondary">Stop speech</button></div></section><aside class="panel"><div class="stats"><div class="stat"><b>Gesture</b><br><span id="gesture">—</span></div><div class="stat"><b>Confidence</b><br><span id="confidence">—</span></div></div><h2>Current sentence</h2><div id="sentence" class="sentence" aria-live="polite">Start signing to build a sentence.</div><div class="controls"><button id="space" class="secondary">Space</button><button id="delete" class="secondary">Delete</button><button id="clear" class="secondary">Clear</button></div><h2>Gesture history</h2><ol id="history" class="history"></ol></aside></div></main><script src="js/camera.js"></script><script src="js/translator.js"></script><script src="js/dashboard.js"></script></body></html>
